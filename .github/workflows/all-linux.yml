name: All Linux targets
# One run for every distro/arch in the README matrix, against any openFrameworks repo + branch.
on:
  workflow_dispatch:
    inputs:
      of_repo:
        description: openFrameworks repository
        default: openframeworks/openFrameworks
      of_branch:
        description: openFrameworks branch/tag/sha to test
        default: master
      level:
        description: smoke = lib-path tests only, full = download + core + unit tests
        type: choice
        options: [full, smoke]
        default: full
jobs:
  test:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # Raspberry Pi OS / Debian arm64 (native on the arm runner)
          - { target: rpios-trixie-arm64, dockerfile: Dockerfile.rpios-trixie, platform: linux/arm64, arch: aarch64, allow: 1, runner: ubuntu-24.04-arm }
          - { target: rpi-arm64, dockerfile: Dockerfile.rpi-arm64, platform: linux/arm64, arch: aarch64, allow: 1, runner: ubuntu-24.04-arm }
          # Full 32-bit Pi setup, core build and unit tests under QEMU.
          - { target: rpi-armv7l, dockerfile: Dockerfile.rpi-arm64, platform: linux/arm/v7, arch: armv7l, allow: 1, runner: ubuntu-24.04-arm, qemu: true }
          # 32-bit Pi userland under QEMU: lib-path smoke only (full compile is too slow emulated)
          - { target: rpios-trixie-armv7, dockerfile: Dockerfile.rpios-trixie, platform: linux/arm/v7, arch: armv7l, allow: 1, runner: ubuntu-24.04-arm, qemu: true, smoke_only: true }
          - { target: kali-arm64, dockerfile: Dockerfile.kali-arm64, platform: linux/arm64, arch: arm64, allow: 0, runner: ubuntu-24.04-arm }
          - { target: jetson-arm64, dockerfile: Dockerfile.jetson-arm64, platform: linux/arm64, arch: jetson, allow: 0, runner: ubuntu-24.04-arm }
          # x86_64
          - { target: ubuntu-2404-amd64, dockerfile: Dockerfile.ubuntu-2404-amd64, platform: linux/amd64, arch: 64, allow: 0, runner: ubuntu-24.04 }
          - { target: ubuntu-2204-amd64, dockerfile: Dockerfile.ubuntu-2204-amd64, platform: linux/amd64, arch: 64, allow: 0, runner: ubuntu-24.04 }
          - { target: debian-amd64, dockerfile: Dockerfile.debian-amd64, platform: linux/amd64, arch: 64, allow: 0, runner: ubuntu-24.04 }
          - { target: fedora-amd64, dockerfile: Dockerfile.fedora-amd64, platform: linux/amd64, arch: 64, allow: 0, runner: ubuntu-24.04 }
          - { target: arch-amd64, dockerfile: Dockerfile.arch-amd64, platform: linux/amd64, arch: 64, allow: 0, runner: ubuntu-24.04 }
          - { target: mint-amd64, dockerfile: Dockerfile.mint-amd64, platform: linux/amd64, arch: 64, allow: 0, runner: ubuntu-24.04 }
          - { target: cachyos-amd64, dockerfile: Dockerfile.cachyos-amd64, platform: linux/amd64, arch: 64, allow: 0, runner: ubuntu-24.04 }
          - { target: pop-amd64, dockerfile: Dockerfile.pop-amd64, platform: linux/amd64, arch: 64, allow: 0, runner: ubuntu-24.04 }
          - { target: zorin-amd64, dockerfile: Dockerfile.zorin-amd64, platform: linux/amd64, arch: 64, allow: 0, runner: ubuntu-24.04 }
          - { target: omarchy-amd64, dockerfile: Dockerfile.omarchy-amd64, platform: linux/amd64, arch: 64, allow: 0, runner: ubuntu-24.04 }
          - { target: kali-amd64, dockerfile: Dockerfile.kali-amd64, platform: linux/amd64, arch: 64, allow: 0, runner: ubuntu-24.04 }
    steps:
      - name: Checkout harness
        uses: actions/checkout@v7
      - name: Checkout openFrameworks
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.of_repo }}
          ref: ${{ inputs.of_branch }}
          path: openFrameworks
      - uses: docker/setup-qemu-action@v3
        if: matrix.qemu
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.target }} image
        run: docker buildx build --load --platform "${{ matrix.platform }}" -t "of-linux-test:${{ matrix.target }}" -f "docker/${{ matrix.dockerfile }}" docker
      - name: Run OF tests (${{ matrix.target }})
        run: |
          set -o pipefail
          docker run --rm --platform "${{ matrix.platform }}" \
            -v "$GITHUB_WORKSPACE/openFrameworks:/src" \
            -v "$GITHUB_WORKSPACE:/harness:ro" \
            -e OF_ARCH="${{ matrix.arch }}" -e ALLOW_INCOMPLETE="${{ matrix.allow }}" \
            -e LC_ALL=C.UTF-8 -e LANG=C.UTF-8 \
            -e SKIP_BUILD=${{ (inputs.level == 'smoke' || matrix.smoke_only == true) && '1' || '0' }} \
            "of-linux-test:${{ matrix.target }}" \
            bash /harness/scripts/inside/run-inside.sh 2>&1 | tee "${{ matrix.target }}-results.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.target }}-results
          path: ${{ matrix.target }}-results.log
